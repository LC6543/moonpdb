name: Bug report
description: Report a parser, validation, or build problem
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach confidential or proprietary PDB files.
        Use a minimized synthetic fixture whenever possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands and a minimal fixture or byte structure.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - wasm-gc
        - wasm
        - native
        - js
        - not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste compiler output or error values. Remove sensitive data.
      render: text
    validations:
      required: false
