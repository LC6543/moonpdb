name: Feature request
description: Propose a new PDB layer or API capability
title: "[feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow or format gap should this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: What should be included, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Format evidence
      description: Link public specifications, fixtures, or interoperability references.
    validations:
      required: false
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: How should the change be validated, including malformed input?
    validations:
      required: true
