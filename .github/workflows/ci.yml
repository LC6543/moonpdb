name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check --target wasm-gc

      - name: Test
        run: moon test --target wasm-gc

      - name: Format
        run: moon fmt --check

      - name: Build
        run: moon build --target wasm-gc

      - name: CLI smoke test
        run: moon run cmd/main -- summary test-data/llvm/global-name-lookup.pdb
